worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

# ---------------------------------------------------------------------------
# Un seul port pour HTTP et HTTPS.
#
# Les navigateurs mobiles récents tentent souvent https:// d'eux-mêmes ; face à
# un serveur en clair la connexion échoue durement (SSL_ERROR_RX_RECORD_TOO_LONG)
# sans repli possible. `ssl_preread` observe le premier octet de la connexion et
# l'aiguille vers le vhost qui convient.
# ---------------------------------------------------------------------------
stream {
    map $ssl_preread_protocol $monopolie_backend {
        ""      127.0.0.1:8080;   # pas de handshake TLS → HTTP en clair
        default 127.0.0.1:8443;   # TLS
    }

    server {
        listen 3000;
        listen [::]:3000;
        ssl_preread on;
        proxy_pass $monopolie_backend;
        proxy_timeout 1h;         # les websockets restent ouverts longtemps
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # l'import d'image passe par l'API : on laisse la marge du quota (120 Ko)
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # vhost HTTP en clair
    server {
        listen 127.0.0.1:8080;
        include /etc/nginx/app.conf;
    }

    # vhost TLS (certificat auto-signé du réseau local)
    server {
        listen 127.0.0.1:8443 ssl;
        http2 on;
        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:4m;
        include /etc/nginx/app.conf;
    }
}
